name: animated_stickers
description: >-
  Plays animated stickers inline on Android and iOS: VP9/VP8 WebM with alpha,
  animated WebP and GIF, decoded natively and drawn into Flutter Textures.
version: 1.0.0
repository: https://github.com/sophie-maney/flutter-animated-stickers
issue_tracker: https://github.com/sophie-maney/flutter-animated-stickers/issues
topics:
  - sticker
  - webm
  - animation
  - video
  - texture

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^23.0.0
  pigeon: ^29.2.0
  material_ui: ^1.11.1

flutter:
  plugin:
    platforms:
      android:
        package: town.leggy.animated_stickers
        pluginClass: AnimatedStickersPlugin
      ios:
        pluginClass: AnimatedStickersPlugin
